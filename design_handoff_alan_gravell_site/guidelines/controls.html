<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font:var(--type-body);}
.l{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-secondary)}</style></head>
<body><div style="padding:28px 32px"><div style="display:flex;flex-direction:column;gap:28px"><div style="display:flex;gap:32px;align-items:center"><span style="font:var(--type-label-l);letter-spacing:var(--tracking-label);text-transform:uppercase;padding:14px 24px;background:var(--ink-9);color:var(--paper-0)">Send enquiry</span><span style="font:var(--type-label-l);letter-spacing:var(--tracking-label);text-transform:uppercase;padding:13px 23px;border:1px solid var(--ink-9)">View series</span><span style="font:var(--type-label-l);letter-spacing:var(--tracking-label);text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:3px">Next plate →</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:32px"><div><div class="l">Name</div><div style="border-bottom:1px solid var(--line-strong);padding:10px 0;font:var(--type-body)">Eleanor</div></div><div><div class="l">Email</div><div style="border-bottom:1px solid var(--line);padding:10px 0;font:var(--type-body);color:var(--text-quiet)">you@example.com</div></div></div></div></div></body></html>
