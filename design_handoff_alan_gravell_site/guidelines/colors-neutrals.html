<!-- @dsCard group="Colors" viewport="700x170" subtitle="Warm near-neutral ground and text" name="Paper & ink" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font:var(--type-body);}
.l{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-secondary)}</style></head>
<body><div style="padding:28px 32px"><div style="display:flex;gap:12px"><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--paper-0);border:1px solid var(--line)"></div><div class="l" style="color:var(--text-primary)">Mat</div><div class="l">--paper-0</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--paper-1);border:1px solid var(--line)"></div><div class="l" style="color:var(--text-primary)">Paper</div><div class="l">--paper-1</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--paper-2);border:1px solid var(--line)"></div><div class="l" style="color:var(--text-primary)">Plate</div><div class="l">--paper-2</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--stone-3);border:1px solid var(--line)"></div><div class="l" style="color:var(--text-primary)">Hairline</div><div class="l">--stone-3</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--stone-6);border:1px solid var(--line)"></div><div class="l" style="color:var(--text-primary)">Stone</div><div class="l">--stone-6</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--ink-9);border:1px solid var(--line)"></div><div class="l" style="color:var(--text-primary)">Ink</div><div class="l">--ink-9</div></div></div></div></body></html>
