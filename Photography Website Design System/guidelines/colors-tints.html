<body><div style="padding:28px 32px;display:flex;gap:12px"><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--tint-sky)"></div><div class="l" style="color:var(--text-primary)">Sky</div><div class="l">--tint-sky</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--tint-sage)"></div><div class="l" style="color:var(--text-primary)">Sage</div><div class="l">--tint-sage</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--tint-mist)"></div><div class="l" style="color:var(--text-primary)">Mist</div><div class="l">--tint-mist</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="height:64px;background:var(--tint-sand)"></div><div class="l" style="color:var(--text-primary)">Sand</div><div class="l">--tint-sand</div></div></div></body></html>
