<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- No logo by design: the name set in a serif is the mark, so the tab
       icon is its initial in ink on the paper ground. -->
  <rect width="32" height="32" fill="#F6F4F0"/>
  <text x="16" y="24" text-anchor="middle" font-family="'Cormorant Garamond', Garamond, 'Times New Roman', serif" font-size="24" fill="#1B1A18">A</text>
</svg>
